<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">SoundCloud Like Ratio promotional tile</title>
  <desc id="description">Orange promotional tile with a percentage icon and extension name.</desc>
  <rect width="440" height="280" fill="#18181b"/>
  <circle cx="70" cy="42" r="110" fill="#ff5500" opacity="0.16"/>
  <circle cx="394" cy="260" r="130" fill="#ff5500" opacity="0.11"/>
  <g transform="translate(42 82)">
    <rect width="116" height="116" rx="29" fill="#ff5500"/>
    <circle cx="39" cy="39" r="13" fill="#ffffff"/>
    <circle cx="77" cy="77" r="13" fill="#ffffff"/>
